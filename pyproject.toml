[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vecport"
version = "0.5.0"
description = "One interface for vector databases."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["vector-database", "migration", "qdrant", "milvus", "pinecone", "weaviate", "pgvector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "qdrant-client>=1.9",
    "pymilvus>=2.4",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pinecone>=5.0",
    "weaviate-client>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
qdrant = [
    "qdrant-client"
]

pinecone = [
    "pinecone"
]

langchain = [
    "langchain-core>=1.0,<2.0",
]

llamaindex = [
    "llama-index-core>=0.14.23,<0.15.0",
]

dev = [
    "pytest",
    "ruff",
    "mypy",
    "langchain-core>=1.0,<2.0",
    "llama-index-core>=0.14.23,<0.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
vecport = "vecport.cli:main"

[project.urls]
Homepage = "https://github.com/HAYATO402/vecport"
Repository = "https://github.com/HAYATO402/vecport"
Issues = "https://github.com/HAYATO402/vecport/issues"
