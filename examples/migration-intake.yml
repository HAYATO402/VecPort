project:
  name: customer-demo

source:
  driver: qdrant
  connection: "${SOURCE_URL}"
  collection: documents

target:
  driver: milvus
  connection: "${TARGET_URL}"
  collection: documents_migrated

data:
  estimated_records: 10000
  dimension: 1536
  collection_count: 1
  vector_mode: dense
  metadata_mapping: false

filters:
  required_operators:
    - "$eq"
    - "$lt"
    - "$in"
    - "$and"
  examples:
    - name: ai_under_10000
      expression:
        "$and":
          - category:
              "$eq": "AI"
          - price:
              "$lt": 10000
    - name: selected_categories
      expression:
        category:
          "$in":
            - AI
            - Finance

metadata_transform:
  rename:
    old_category: category
    createdAt: created_at
  drop:
    - debug
  defaults:
    source: legacy
  cast:
    price: int
  strict: false

migration:
  batch_size: 500
  verify: true
  resume: true
  existing_policy: repair

benchmark:
  enabled: true
  top_k: 10
  queries: 50

search_comparison:
  enabled: true
  top_k: 10
  warmup: 3
  minimum_recall_at_k: 0.90
  minimum_top1_match_rate: 0.80

application:
  language: python
  framework: langchain

deliverables:
  migration_plan: true
  verification: true
  benchmark: true
  code_patch: true
