name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install VecPort and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,langchain,llamaindex]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run tests
        # Service-backed Milvus and pgvector tests run outside standard CI.
        run: |
          python -m pytest -v \
            --ignore-glob="tests/test_milvus*.py" \
            --ignore-glob="tests/test_pgvector*.py"

      - name: Run Qdrant compliance smoke test
        run: vecport compliance --url "vecport://qdrant"

      - name: Check installed dependencies
        run: python -m pip check

  package:
    name: Package build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Show distributions
        run: ls -lh dist/

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Smoke test VecPort
        run: |
          python -c "import vecport; print('VecPort import OK')"
          vecport --help

  ci-success:
    name: CI success
    if: ${{ always() }}
    needs:
      - test
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Verify all required jobs
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
